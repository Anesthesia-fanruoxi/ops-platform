---
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-${project_name}-${env_name}-${init_job_tag}
  namespace: ${project_name}-${env_name}-middleware
  labels:
    app: mysql-init
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: mysql-init
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ${image_pull_secret}
      containers:
        - name: mysql-init
          image: ${hub_server}/middleware/mysql:8.0.27
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: MYSQL_APP_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: username
            - name: MYSQL_APP_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
          volumeMounts:
            - name: sql
              mountPath: /sql
          command: ["sh", "-c"]
          args:
            - |
              # mysqld 在初始化阶段就可能响应 ping，必须认证成功后再导表
              until mysql -h mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for mysql auth"; sleep 3
              done
              export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
              mysql -h mysql -uroot -e "CREATE DATABASE IF NOT EXISTS ApolloConfigDB DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS ApolloPortalDB DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS seata DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" || echo "create database warning"
              if [ "${MYSQL_APP_USER}" != "root" ]; then
                echo "create app user ${MYSQL_APP_USER}"
                mysql -h mysql -uroot -e "CREATE USER IF NOT EXISTS '${MYSQL_APP_USER}'@'%' IDENTIFIED BY '${MYSQL_APP_PASS}'; ALTER USER '${MYSQL_APP_USER}'@'%' IDENTIFIED BY '${MYSQL_APP_PASS}'; GRANT ALL PRIVILEGES ON ApolloConfigDB.* TO '${MYSQL_APP_USER}'@'%'; GRANT ALL PRIVILEGES ON ApolloPortalDB.* TO '${MYSQL_APP_USER}'@'%'; GRANT ALL PRIVILEGES ON seata.* TO '${MYSQL_APP_USER}'@'%'; GRANT ALL PRIVILEGES ON xxl_job.* TO '${MYSQL_APP_USER}'@'%'; FLUSH PRIVILEGES;" || echo "create app user warning"
              fi
              if [ "$(mysql -h mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ApolloConfigDB' AND table_name='ServerConfig'" 2>/dev/null)" != "1" ]; then
                echo "init ApolloConfigDB"
                mysql --force -h mysql -uroot ApolloConfigDB < /sql/apollo-configdb.sql || echo "ApolloConfigDB import warning"
              fi
              # Apollo Admin 读取的是 ApolloConfigDB.ServerConfig.eureka.service.url，
              # 不是 Deployment 的 EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE；必须指向 K8s Service。
              mysql -h mysql -uroot -D ApolloConfigDB -e "INSERT INTO ServerConfig (\`Key\`, \`Value\`, \`Comment\`) VALUES ('eureka.service.url','http://apollo-configservice:8080/eureka/','ConfigService Eureka URL') ON DUPLICATE KEY UPDATE \`Value\`=VALUES(\`Value\`);" || echo "apollo eureka url warning"
              if [ "$(mysql -h mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ApolloPortalDB' AND table_name='ServerConfig'" 2>/dev/null)" != "1" ]; then
                echo "init ApolloPortalDB"
                mysql --force -h mysql -uroot ApolloPortalDB < /sql/apollo-portaldb.sql || echo "ApolloPortalDB import warning"
              fi
              if [ "$(mysql -h mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='seata' AND table_name='global_table'" 2>/dev/null)" != "1" ]; then
                echo "init seata"
                mysql --force -h mysql -uroot seata < /sql/seata-schema.sql || echo "seata import warning"
              fi
              if [ "$(mysql -h mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='xxl_job' AND table_name='xxl_job_user'" 2>/dev/null)" != "1" ]; then
                echo "init xxl_job"
                mysql --force -h mysql -uroot < /sql/xxljob-schema.sql || echo "xxl_job import warning"
              fi
              echo "apply xxl_job legacy columns"
              mysql --force -h mysql -uroot xxl_job < /sql/xxl-job-compat.sql || echo "xxl legacy compat warning"
              mysql -h mysql -uroot -D ApolloPortalDB -e "INSERT INTO ServerConfig (\`Key\`, \`Value\`, \`Comment\`) VALUES ('apollo.portal.envs','${apollo_env}','env list'), ('apollo.portal.meta.servers','{\"${apollo_env_upper}\":\"http://apollo-configservice:8080\"}','meta servers') ON DUPLICATE KEY UPDATE \`Value\`=VALUES(\`Value\`);" || echo "portal meta warning"
              # 最终校验关键表，避免导入被忽略后 Job 仍显示成功
              FAILED=0
              for item in "ApolloConfigDB:ServerConfig" "ApolloPortalDB:ServerConfig" "seata:global_table" "xxl_job:xxl_job_user"; do
                db="${item%%:*}"; tbl="${item##*:}"
                c=$(mysql -h mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${db}' AND table_name='${tbl}'" 2>/dev/null)
                if [ "$c" != "1" ]; then echo "missing table ${db}.${tbl}"; FAILED=1; fi
              done
              XXL_CRON_COL=$(mysql -h mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='xxl_job' AND table_name='xxl_job_info' AND column_name='job_cron'" 2>/dev/null)
              if [ "$XXL_CRON_COL" != "1" ]; then echo "missing xxl_job_info.job_cron"; FAILED=1; fi
              META_COUNT=$(mysql -h mysql -uroot -N -D ApolloPortalDB -e "SELECT COUNT(*) FROM ServerConfig WHERE \`Key\`='apollo.portal.meta.servers'" 2>/dev/null)
              if [ "$META_COUNT" != "1" ]; then echo "missing portal meta"; FAILED=1; fi
              if [ "$FAILED" != "0" ]; then echo "mysql init incomplete"; exit 1; fi
              echo "mysql init done"
      volumes:
        - name: sql
          configMap:
            name: mysql-init-sql
