    -- 兼容镜像内旧版 xxl-job：新 schema 没有 job_cron/job_desc，name 也不允许为空
    ALTER TABLE `xxl_job_info` ADD COLUMN `job_cron` VARCHAR(128) DEFAULT NULL AFTER `job_group`;
    ALTER TABLE `xxl_job_info` ADD COLUMN `job_desc` VARCHAR(255) DEFAULT NULL AFTER `job_cron`;
