---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: ${project_name}-${env_name}-middleware
  labels:
    app: eureka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      imagePullSecrets:
        - name: ${image_pull_secret}
      containers:
        - name: eureka
          image: ${hub_server}/middleware/eureka:2.1.0.RELEASE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "${env_name}"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: ${project_name}-${env_name}-middleware
  labels:
    app: eureka
spec:
  type: ClusterIP
  selector:
    app: eureka
  ports:
    - name: http
      port: 8761
      targetPort: 8761
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-nodeport
  namespace: ${project_name}-${env_name}-middleware
  labels:
    app: eureka
spec:
  type: NodePort
  selector:
    app: eureka
  ports:
    - name: http
      port: 8761
      targetPort: 8761
      nodePort: ${middleware_port}
